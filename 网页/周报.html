<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>多账号周报处理工具（可多次添加文件）</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 850px;
            width: 96%;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
        }
        input[type="file"], button {
            margin: 10px 5px;
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
        }
        table {
            border-collapse: collapse;
            margin: 20px auto;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
        }
        th {
            background-color: #4CAF50;
            color: #fff;
        }
        tr:nth-child(even) td {
            background-color: #f2f2f2;
        }
        tr:hover td {
            background-color: #ddd;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
        .filename-title {
            margin-top: 20px;
            font-weight: bold;
            color: #2196f3;
        }
        .file-list {
            margin: 10px auto 10px auto;
            padding: 0;
            list-style: none;
            max-width: 500px;
            text-align: left;
        }
        .file-list li {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        .file-remove {
            margin-left: 10px;
            color: #c00;
            cursor: pointer;
            padding: 2px 6px;
            background: #ffeaea;
            border: 1px solid #c66;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>多账号周报文件处理<br><span style="font-size:14px;color:#888;">（仅统计退款金额，支持多次添加）</span></h2>
        <input type="file" id="fileInput" accept=".csv" multiple>
        <button onclick="processFiles()">处理所有上传文件</button>
        <div>
            <strong>已选文件：</strong>
            <ul class="file-list" id="fileList"></ul>
        </div>
        <div id="result"></div>
    </div>
    <script>
        // 用于存储所有用户已选文件的数组
        let selectedFiles = [];

        // 切换时，把新选的文件append进去selectedFiles（去重：同名文件将后选覆盖前选）
        document.getElementById('fileInput').addEventListener('change', function(e){
            const files = Array.from(e.target.files);
            // 文件名唯一处理
            const fileMap = new Map();
            selectedFiles.forEach(file => fileMap.set(file.name, file));
            files.forEach(file => fileMap.set(file.name, file)); // 后选的覆盖前选的
            selectedFiles = Array.from(fileMap.values());
            renderFileList();
            document.getElementById('fileInput').value = ''; // 方便连续选
        });

        // 展示所有已选文件，可逐一删除
        function renderFileList() {
            const list = document.getElementById('fileList');
            if (!selectedFiles.length) {
                list.innerHTML = '<li style="color:#ccc;">（无文件）</li>';
                return;
            }
            list.innerHTML = selectedFiles.map((file, idx) =>
                `<li>${escapeHtml(file.name)}
                     <span class="file-remove" title="删除此文件" onclick="removeFile(${idx})">删除</span>
                 </li>`).join('');
        }

        // 删除已选文件
        function removeFile(idx) {
            selectedFiles.splice(idx, 1);
            renderFileList();
        }

        // 处理所有已上传的文件
        function processFiles() {
            const resultDiv = document.getElementById('result');
            if (!selectedFiles.length) {
                resultDiv.innerHTML = '<span style="color: red">请先上传一个或多个CSV文件</span>';
                return;
            }
            resultDiv.innerHTML = '<div class="loading">处理中...</div>';

            // 当前仅需统计退款类型
            const order = ['Refund'];
            const labelMap = {
                'Refund': '退款金额'
            };

            // 汇总所有账号合计
            let totalSums = {};
            order.forEach(cat => totalSums[cat] = 0);

            let processed = 0;
            let fileResults = new Array(selectedFiles.length);

            for (let i = 0; i < selectedFiles.length; i++) {
                const reader = new FileReader();
                (function(file, idx){
                    reader.onload = function(e) {
                        try {
                            const text = e.target.result;
                            const allLines = text.split(/\r\n|\n/);

                            if (allLines.length < 10) {
                                throw new Error('文件行数不足，无法找到第10行标题行');
                            }

                            // 获取第10行作为标题行（索引为9）
                            const headerLine = allLines[9];
                            // 用正则分割CSV行并去掉引号，转换为小写便于无视大小写匹配
                            const headers = headerLine.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(s => s.replace(/^"|"$/g, '').trim().toLowerCase());

                            // 查找 type 和 total 的列索引
                            const typeIdx = headers.indexOf('type');
                            const totalIdx = headers.indexOf('total');

                            if (typeIdx === -1 || totalIdx === -1) {
                                throw new Error('标题行中未找到 "type" 或 "total" 列，请确认格式');
                            }

                            // 第11行开始为数据
                            const dataLines = allLines.slice(10);

                            // 单个文件结果初始化
                            let results = {};
                            order.forEach(cat => results[cat] = 0);

                            dataLines.forEach(line => {
                                if (!line.trim()) return;
                                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                                // 防止空行或被截断的行
                                if (cols.length <= Math.max(typeIdx, totalIdx)) return;

                                // 取出当前行的类型
                                const category = cols[typeIdx].replace(/^"|"$/g, '').trim();

                                // 只统计 Refund
                                if (category === 'Refund') {
                                    const valueStr = cols[totalIdx].replace(/[^\d.-]/g, '').trim() || '0';
                                    const value = parseFloat(valueStr) || 0;
                                    // 默认统计绝对值（退款一般在表里是负数，取绝对值更直观，如需保留原负号请移除Math.abs）
                                    results['Refund'] += Math.abs(value);
                                }
                            });

                            // 累加到总和
                            order.forEach(cat => {
                                totalSums[cat] += results[cat];
                            });

                            // 保存到所有文件结果
                            fileResults[idx] = {
                                filename: file.name,
                                results: results
                            };
                        } catch (err) {
                            fileResults[idx] = {
                                filename: file.name,
                                error: '处理失败: ' + escapeHtml(err.message)
                            };
                        }

                        processed++;
                        if (processed === selectedFiles.length) {
                            renderAllResults(fileResults, totalSums, resultDiv, order, labelMap);
                        }
                    };
                    reader.onerror = function() {
                        fileResults[idx] = {
                            filename: file.name,
                            error: '文件读取失败'
                        };
                        processed++;
                        if (processed === selectedFiles.length) {
                            renderAllResults(fileResults, totalSums, resultDiv, order, labelMap);
                        }
                    };
                    reader.readAsText(file, 'UTF-8');
                })(selectedFiles[i], i);
            }
        }

        function renderAllResults(fileResults, totalSums, resultDiv, order, labelMap) {
            let html = '';
            let hasData = false;

            // 表格表头
            html += `<table>
                        <tr>
                            <th>文件名</th>
                            ${order.map(cat => `<th>${escapeHtml(labelMap[cat] || cat)}</th>`).join('')}
                        </tr>`;

            fileResults.forEach(fileResult => {
                if (fileResult.error) {
                    html += `<tr><td colspan="${order.length + 1}" style="color: red">${escapeHtml(fileResult.filename)}: ${escapeHtml(fileResult.error)}</td></tr>`;
                    return;
                }

                const rowData = order.map(cat =>
                    typeof fileResult.results[cat] !== 'undefined'
                        ? `<td>${fileResult.results[cat].toFixed(2)}</td>`
                        : `<td>0.00</td>`
                ).join('');

                html += `<tr>
                            <td>${escapeHtml(fileResult.filename)}</td>
                            ${rowData}
                        </tr>`;

                if (Object.values(fileResult.results).some(val => val > 0)) {
                    hasData = true;
                }
            });

            // 总计行
            html += `<tr style="font-weight:bold;color:#2e7d32;background:#e8f5e9;">
                        <td>总计</td>
                        ${order.map(cat => `<td>${totalSums[cat].toFixed(2)}</td>`).join('')}
                     </tr>`;
            html += `</table>`;

            if (!hasData) html += `<div style="color: red; margin-top: 10px;">文件中没有匹配到"Refund"金额或均为 0</div>`;
            resultDiv.innerHTML = html;
        }

        // 防止XSS攻击的HTML转义
        function escapeHtml(text) {
            return text.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 初始化文件列表展示
        renderFileList();
    </script>
</body>
</html>
